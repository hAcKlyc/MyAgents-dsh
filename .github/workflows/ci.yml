name: foundation-ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: myagents-dsh
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: myagents-dsh
          persist-credentials: false
      - name: Checkout pinned DSH baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Prepare exact dependencies and verified DSH for repository checks
        env:
          DSH_SOURCE: ${{ github.workspace }}/deepseek-harness
        shell: bash
        run: node scripts/setup.mjs --checks-only --dsh-source "$DSH_SOURCE"
      - name: Test Windows without credentials or network
        run: npm test

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: myagents-dsh
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: myagents-dsh
          persist-credentials: false
      - name: Checkout pinned DSH baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0
      - name: Prepare exact dependencies and verified DSH for repository checks
        env:
          DSH_SOURCE: ${{ github.workspace }}/deepseek-harness
        run: npm exec -- node scripts/setup.mjs --checks-only --dsh-source "$DSH_SOURCE"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run lint
      - name: Test without credentials or network
        run: npm test
      - name: Build
        run: npm run build
      - name: Checkout pinned pi-ai source for Runtime composition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: earendil-works/pi
          ref: d981de1229ef899957bbe968bc8dcda02a21f477
          path: pi
          persist-credentials: false
      - name: Validate installed Runtime composition
        env:
          PI_AI_SOURCE_DIR: ${{ github.workspace }}/pi
          RUNTIME_ARTIFACT_OUT: ${{ runner.temp }}/myagents-dsh-runtime-composition
        run: |
          npm ci --prefix "$PI_AI_SOURCE_DIR" --ignore-scripts --no-audit --no-fund --workspace @earendil-works/pi-ai --include-workspace-root
          npm cache add @earendil-works/pi-ai@0.85.1
          artifact_digest=$(node -p "require('./packages/product-profile/manifests/accepted-patched-dsh-artifact-v1.json').manifestSha256")
          npm_cache=$(npm config get cache)
          npm run check:dsh-runtime-composition -- \
            --artifact "tmp/setup/artifacts/$artifact_digest" \
            --expected-manifest-sha256 "$artifact_digest" \
            --npm-cache "$npm_cache" \
            --pi-ai-source "$PI_AI_SOURCE_DIR" \
            --runtime-artifact-out "$RUNTIME_ARTIFACT_OUT"

  patched-dsh-seams:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact MyAgents revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: myagents-dsh
          persist-credentials: false
      - name: Checkout exact DSH seam baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: myagents-dsh/.nvmrc
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0
      - name: Install exact MyAgents toolchain
        working-directory: myagents-dsh
        run: |
          npm ci
      - name: Install pinned pnpm
        working-directory: myagents-dsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Prime historical patched-source dependency store
        working-directory: myagents-dsh
        run: npm exec -- node --import tsx scripts/prime-historical-dsh-store.ts --source ../deepseek-harness
      - name: Compile and test the exact patched DSH source
        working-directory: myagents-dsh
        run: npx tsx scripts/verify-dsh-seams.ts --check-source ../deepseek-harness --compile-test
